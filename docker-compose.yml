services:
  version: '4.1.2'

  services:
    postgres:
    image: postgres:15-alpine
    container_name: iso_postgres
    environment:
      POSTGRES_DB: iso_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1128190666
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  volumes:
    pgdata: